name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  security:
    name: Security gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Student and guardian records must never be reachable without a session.
      # The suite in tests/security.test.ts enforces this; this job fails fast
      # on the patterns most likely to reintroduce the problem.
      - name: Reject committed credentials
        run: |
          set +e
          # Fragments are joined at runtime so this workflow never matches itself.
          P1="ey""J[A-Za-z0-9_-]{30,}"
          P2="sk""_live_[A-Za-z0-9]{20,}"
          PATTERN="$P1|$P2"
          MATCHES=$(grep -rInE "$PATTERN" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.next \
            --exclude=package-lock.json --exclude=.github/workflows/ci.yml . )
          if [ -n "$MATCHES" ]; then
            echo "::error::Possible credential committed. Rotate it and remove it from history."
            echo "$MATCHES" | sed -E 's/(ey""J|sk""_live_)[A-Za-z0-9_-]+/\1***REDACTED***/g'
            exit 1
          fi
          echo "No credential patterns found."

      - name: Ensure .env files are untracked
        run: |
          if git ls-files --error-unmatch .env .env.local >/dev/null 2>&1; then
            echo "::error::An environment file is tracked. Only .env.example belongs in git."
            exit 1
          fi
          echo "No environment files tracked."

      - name: Reject the service role client on user-facing routes
        run: |
          set +e
          # configuredOrNull() bypasses row level security. It is permitted only
          # on paths with no user context, which are listed in the test suite.
          HITS=$(grep -rln "configuredOrNull(" app/api \
            | grep -v "app/api/payments/" \
            | grep -v "app/api/invitations/accept/" \
            | grep -v "app/api/setup/organization/")
          if [ -n "$HITS" ]; then
            echo "::error::Service role client used on a user-facing route:"
            echo "$HITS"
            exit 1
          fi
          echo "User-facing routes use the request-scoped client."
